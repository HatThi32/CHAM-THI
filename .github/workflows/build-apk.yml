name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "com.chamthi.omr2025",
            "appName": "Cham Thi QM 2025",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: Install and Build Android Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Compile APK via Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cham-Thi-QM-2025-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
