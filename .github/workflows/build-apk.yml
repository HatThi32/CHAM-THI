name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bước 1 - Tải mã nguồn kho lưu trữ
        uses: actions/checkout@v4

      - name: Bước 2 - Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Bước 3 - Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Bước 4 - Khởi tạo môi trường đóng gói Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Cham Thi QM 2025" "com.chamthi.omr2025" --web-dir .
          npx cap add android

      - name: Bước 5 - Đồng bộ mã nguồn index.html vào dự án Android
        run: |
          npx cap copy android

      - name: Bước 6 - Cấp quyền thực thi và biên dịch file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Bước 7 - Xuất file cài đặt APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cham-Thi-QM-2025-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
