<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chấm Thi QM 2025</title>
    <!-- Nạp thư viện quét Camera & Xuất Excel -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-purple: #511394;
            --accent-green: #00bfa5;
            --bg-gray: #f4f5f9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-gray); color: #333;
        }
        .app-bar {
            background-color: var(--primary-purple); color: white;
            padding: 14px 16px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .app-bar h1 { margin: 0; font-size: 18px; font-weight: bold; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .view-panel { display: none; padding: 14px; min-height: 85vh; }
        .active-view { display: block; }
        .menu-btn {
            display: flex; align-items: center; justify-content: space-between;
            background: white; border: none; width: 100%; padding: 16px 18px;
            margin-bottom: 12px; border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .exam-card {
            background: white; border-radius: 12px; padding: 16px;
            margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer;
        }
        .exam-card h3 { margin: 0 0 6px 0; font-size: 17px; }
        .exam-meta { font-size: 13px; color: #666; margin: 3px 0; }
        .graded-item {
            background: white; border-radius: 10px; padding: 12px;
            margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .name-box {
            width: 58%; height: 50px; background-color: #fafafa;
            border: 1px solid #ddd; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .name-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .score-info { width: 38%; text-align: right; }
        .score-info .val { font-size: 16px; font-weight: bold; color: #d32f2f; }

        /* KHUNG CHẤM BÀI QUA HTML5-CAMERA CHẮC CHẮN MỞ ĐƯỢC */
        #camera-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 500; display: none;
            flex-direction: column; justify-content: space-between;
        }
        #camera-feed-box {
            position: relative; width: 100%; flex: 1;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #omr-reader-view {
            width: 100% !important; height: 100% !important;
        }
        #omr-reader-view video {
            width: 100% !important; height: 100% !important; object-fit: cover !important;
        }
        .scanner-guide-box {
            position: absolute;
            width: 90vw;
            height: 52vw;
            border: 3px dashed #00e676;
            border-radius: 12px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        .guide-label {
            position: absolute; top: 15px; left: 0; right: 0;
            text-align: center; color: #fff; font-size: 14px; font-weight: bold;
            text-shadow: 1px 1px 3px #000; z-index: 20;
        }
        .cam-controls {
            height: 95px; background: rgba(10, 10, 10, 0.95);
            display: flex; align-items: center; justify-content: space-around;
            padding: 10px 20px; z-index: 20;
        }
        .snap-btn {
            background: #ff5722; color: white; border: none;
            width: 70px; height: 70px; border-radius: 50%;
            font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(255,87,34,0.8);
        }
        .ctrl-btn {
            background: #333; color: white; border: 1px solid #777;
            padding: 10px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
        }
        .modal {
            display: none; position: fixed; z-index: 600; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; width: 85%; max-width: 340px; border-radius: 12px; padding: 20px;
        }
        .modal-action {
            display: block; width: 100%; padding: 12px 0; text-align: left;
            background: none; border: none; font-size: 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH CHỦ -->
    <div id="view-home" class="view-panel active-view">
        <div class="app-bar"><h1>Chấm Thi 2025</h1></div>
        <div style="text-align: center; margin: 25px 0 15px 0;">
            <h2 style="color: #444; margin: 0;">Chấm thi QM</h2>
            <div style="font-size: 13px; color: #777;">Hệ thống nhận dạng OMR 2025</div>
        </div>
        <div style="padding: 10px 4px;">
            <button class="menu-btn" onclick="navigateTo('view-exam-list')">
                <span>📑 Danh sách chấm</span><span>›</span>
            </button>
            <button class="menu-btn" onclick="alert('Phiếu chuẩn QM 2025 Sử, Tin, CN, GDPL đã tích hợp sẵn.')">
                <span>📄 Tải phiếu trả lời</span><span>›</span>
            </button>
            <button class="menu-btn" onclick="alert('Dữ liệu ảnh lưu cục bộ trong app, không xuất hiện ở Thư viện ảnh.')">
                <span>⚙️ Cài đặt</span><span>›</span>
            </button>
        </div>
    </div>

    <!-- 2. DANH SÁCH ĐỢT THI -->
    <div id="view-exam-list" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-home')">←</button>
            <h1>Danh sách chấm</h1>
            <div></div>
        </div>
        <div id="exam-cards-container" style="padding-top: 10px;"></div>
    </div>

    <!-- 3. CHI TIẾT ĐỢT THI -->
    <div id="view-exam-detail" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-exam-list')">←</button>
            <h1 id="detail-title">CK2 11</h1>
            <div></div>
        </div>
        <div style="padding-top: 14px;">
            <button class="menu-btn" onclick="openKeySyncDialog()">
                <span>🔑 Nạp Đáp án QR</span><span>›</span>
            </button>
            
            <!-- Nút 1: Mở Camera trực tiếp quét bài -->
            <button class="menu-btn" style="background: #e8f5e9; border: 1.5px solid #2e7d32;" onclick="startOMRCameraEngine()">
                <span style="color: #1b5e20; font-weight: bold;">📷 Chấm bài (Mở Camera ngay)</span><span style="color: #1b5e20;">›</span>
            </button>

            <!-- Nút 2: Mở Camera gốc chụp ảnh siêu nét -->
            <button class="menu-btn" style="background: #e3f2fd; border: 1px solid #90caf9;" onclick="document.getElementById('native-cam-input').click()">
                <span style="color: #0d47a1;">📸 Chụp bài bằng Máy ảnh gốc</span><span style="color: #0d47a1;">›</span>
            </button>
            <input type="file" id="native-cam-input" accept="image/*" capture="environment" style="display:none" onchange="handleNativeImageCapture(event)">
            
            <button class="menu-btn" onclick="navigateTo('view-graded-list')">
                <span>🖼️ Bài đã chấm</span><span>›</span>
            </button>
            <button class="menu-btn" onclick="openExportModal()">
                <span>📤 Xuất kết quả Excel</span><span>›</span>
            </button>
        </div>
    </div>

    <!-- 4. DANH SÁCH BÀI ĐÃ CHẤM -->
    <div id="view-graded-list" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-exam-detail')">←</button>
            <h1 id="graded-header-title">CK2 11</h1>
            <div></div>
        </div>
        <div id="graded-students-container" style="padding-top: 10px;"></div>
    </div>

    <!-- KHUNG CAMERA CHẤM BÀI TRỰC TIẾP (SỬ DỤNG HTML5-QRCODE ENGINE) -->
    <div id="camera-wrapper">
        <div class="guide-label">CĂN PHIẾU QM 2025 VÀO KHUNG XANH</div>
        <div id="camera-feed-box">
            <div id="omr-reader-view"></div>
            <div class="scanner-guide-box"></div>
        </div>
        <div class="cam-controls">
            <button class="ctrl-btn" onclick="stopOMRCameraEngine()">HỦY</button>
            <button class="snap-btn" onclick="captureLiveFromVideo()">CHẤM</button>
            <button class="ctrl-btn" onclick="document.getElementById('native-cam-input').click()">MÁY ẢNH</button>
        </div>
    </div>
    <canvas id="proc-canvas" style="display: none;"></canvas>

    <!-- POPUP XUẤT EXCEL -->
    <div id="export-modal" class="modal">
        <div class="modal-box">
            <h3>Xuất kết quả</h3>
            <button class="modal-action" onclick="exportToExcel('DIEM')">Xuất Kết quả Điểm</button>
            <button class="modal-action" onclick="exportToExcel('LUA_CHON')">Xuất Kết quả Lựa chọn</button>
            <button class="modal-action" onclick="exportToExcel('DUNG_SAI')">Xuất Kết quả Đúng sai</button>
            <div style="text-align: right; margin-top: 15px; color: #00bfa5; cursor: pointer; font-weight: bold;" onclick="closeExportModal()">THOÁT</div>
        </div>
    </div>

    <!-- POPUP NẠP QR -->
    <div id="qr-dialog" class="modal">
        <div class="modal-box" style="text-align: center;">
            <h3>Nạp Đáp Án Đợt Thi</h3>
            <div id="qr-reader" style="width: 100%; margin: 0 auto;"></div>
            <button class="ctrl-btn" style="width: 100%; margin-top: 10px;" onclick="closeKeySyncDialog()">Đóng</button>
        </div>
    </div>

    <script>
        // =========================================================
        // 1. INDEXEDDB: LƯU TRỮ ẢNH HỌC SINH NỘI BỘ (PRIVATE SANDBOX)
        // =========================================================
        const DB_NAME = "QM_OMR_Internal_Storage";
        const STORE_NAME = "student_exam_images";
        let dbInstance = null;

        function initIndexedDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };
                req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
                req.onerror = () => resolve(null);
            });
        }

        function saveImageInternal(studentId, base64Data) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(false);
                const tx = dbInstance.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put({ id: studentId, image: base64Data });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        }

        function getImageInternal(studentId) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction(STORE_NAME, "readonly");
                const q = tx.objectStore(STORE_NAME).get(studentId);
                q.onsuccess = () => resolve(q.result ? q.result.image : null);
                q.onerror = () => resolve(null);
            });
        }

        // =========================================================
        // 2. CƠ SỞ DỮ LIỆU ĐỢT THI
        // =========================================================
        let examBatches = JSON.parse(localStorage.getItem('qm_exam_batches')) || [
            {
                id: "CK2_11",
                name: "CK2 11",
                date: "2026-04-20 08:26:55",
                sheetType: "Phiếu: QM 2025 - Sử, Tin, CN, GDPL",
                structure: "Số câu: 12; 4; 0",
                keys: {
                    "0001": {"part1": ["C","A","B","B","A","A","B","C","A","A","D","B"], "part2": ["SĐĐĐ","ĐSĐS","SĐSĐ","SĐĐĐ"]},
                    "0002": {"part1": ["A","A","D","C","D","D","C","A","D","A","B","B"], "part2": ["ĐSĐĐ","SĐĐĐ","SSĐĐ","ĐĐSS"]},
                    "0003": {"part1": ["A","A","B","C","A","C","C","A","C","B","C","A"], "part2": ["SĐĐĐ","SĐSĐ","SĐĐĐ","ĐSSĐ"]},
                    "0004": {"part1": ["C","A","B","D","C","D","B","A","C","A","B","D"], "part2": ["ĐSĐĐ","ĐĐSS","ĐĐĐS","SĐĐS"]}
                },
                students: [
                    { id: "STU_1", name: "Phan Minh Hoàng", sbd: "01001", code: "0002", p1Score: 2.75, p2Score: 3.5, total: 6.25, choicesP1: ["A","A","D","C","D","D","C","A","D","A","B","B"], choicesP2: ["ĐSĐĐ","SĐĐĐ","SSĐĐ","ĐĐSS"] },
                    { id: "STU_2", name: "Đặng Phúc Minh Căn", sbd: "01002", code: "0001", p1Score: 2.5, p2Score: 2.5, total: 5.00, choicesP1: ["C","A","B","B","A","B","B","C","A","A","B","B"], choicesP2: ["SĐĐĐ","ĐSĐĐ","SĐSĐ","SĐĐS"] }
                ]
            }
        ];

        let currentBatch = examBatches[0];
        let omrCameraEngine = null;
        let qrScanner = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initIndexedDB();
        });

        function saveStorage() {
            localStorage.setItem('qm_exam_batches', JSON.stringify(examBatches));
        }

        function navigateTo(viewId) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            if (viewId === 'view-exam-list') renderExamBatchCards();
            if (viewId === 'view-graded-list') renderGradedStudents();
        }

        function renderExamBatchCards() {
            const container = document.getElementById('exam-cards-container');
            container.innerHTML = "";
            examBatches.forEach(batch => {
                const card = document.createElement('div');
                card.className = "exam-card";
                card.onclick = () => {
                    currentBatch = batch;
                    document.getElementById('detail-title').innerText = currentBatch.name;
                    document.getElementById('graded-header-title').innerText = currentBatch.name;
                    navigateTo('view-exam-detail');
                };
                card.innerHTML = `
                    <h3>${batch.name}</h3>
                    <div class="exam-meta">${batch.date}</div>
                    <div class="exam-meta">${batch.sheetType}</div>
                    <div class="exam-meta">${batch.structure}</div>
                `;
                container.appendChild(card);
            });
        }

        async function renderGradedStudents() {
            const container = document.getElementById('graded-students-container');
            container.innerHTML = "";
            if (!currentBatch.students || currentBatch.students.length === 0) {
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#888;'>Chưa có bài thi nào được chấm.</div>";
                return;
            }
            for (const st of currentBatch.students) {
                const storedImg = await getImageInternal(st.id);
                const item = document.createElement('div');
                item.className = "graded-item";
                const nameDisplay = storedImg 
                    ? `<img src="${storedImg}" alt="Vùng chữ viết tay">` 
                    : `<span style="font-family: cursive; font-size: 15px; color: #b71c1c; font-weight: bold;">${st.name}</span>`;
                item.innerHTML = `
                    <div class="name-box">${nameDisplay}</div>
                    <div class="score-info">
                        <div style="font-size: 12px; color: #555;">SBD: ${st.sbd}</div>
                        <div style="font-size: 12px; color: #555;">Mã đề: <b>${st.code}</b></div>
                        <div class="val">Điểm: ${st.total.toFixed(2)}</div>
                    </div>
                `;
                container.appendChild(item);
            }
        }

        // =========================================================
        // 3. KHỞI ĐỘNG CAMERA BẰNG ENGINE HTML5-QRCODE (100% HIỂN THỊ)
        // =========================================================
        function startOMRCameraEngine() {
            const wrapper = document.getElementById('camera-wrapper');
            wrapper.style.display = 'flex';

            if (!omrCameraEngine) {
                omrCameraEngine = new Html5Qrcode("omr-reader-view");
            }

            const config = {
                fps: 20,
                videoConstraints: {
                    facingMode: { ideal: "environment" }
                }
            };

            omrCameraEngine.start(
                { facingMode: "environment" },
                config,
                () => {}, // Không cần quét mã QR, chỉ lấy luồng video hiển thị
                () => {}
            ).catch(err => {
                console.error("Camera engine error:", err);
                stopOMRCameraEngine();
                alert("Trình duyệt không thể kích hoạt luồng camera: " + err + ". Chuyển sang máy ảnh gốc!");
                document.getElementById('native-cam-input').click();
            });
        }

        function stopOMRCameraEngine() {
            if (omrCameraEngine && omrCameraEngine.isScanning) {
                omrCameraEngine.stop().then(() => {
                    document.getElementById('camera-wrapper').style.display = 'none';
                }).catch(() => {
                    document.getElementById('camera-wrapper').style.display = 'none';
                });
            } else {
                document.getElementById('camera-wrapper').style.display = 'none';
            }
        }

        function captureLiveFromVideo() {
            const videoEl = document.querySelector("#omr-reader-view video");
            if (!videoEl) {
                alert("Chưa nạp được hình ảnh camera!");
                return;
            }
            const canvas = document.getElementById('proc-canvas');
            canvas.width = videoEl.videoWidth || 1280;
            canvas.height = videoEl.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

            stopOMRCameraEngine();
            processGradingFromCanvas(canvas);
        }

        function handleNativeImageCapture(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('proc-canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    processGradingFromCanvas(canvas);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = "";
        }

        function calcPart2Score(correctCount) {
            if (correctCount === 1) return 0.1;
            if (correctCount === 2) return 0.25;
            if (correctCount === 3) return 0.5;
            if (correctCount === 4) return 1.0;
            return 0.0;
        }

        async function processGradingFromCanvas(canvas) {
            // Cắt vùng Họ Tên và lưu vào IndexedDB nội bộ
            const cropCanvas = document.createElement('canvas');
            const cropCtx = cropCanvas.getContext('2d');
            const nameWidth = Math.floor(canvas.width * 0.45);
            const nameHeight = Math.floor(canvas.height * 0.14);
            cropCanvas.width = nameWidth;
            cropCanvas.height = nameHeight;
            cropCtx.drawImage(canvas, Math.floor(canvas.width * 0.1), Math.floor(canvas.height * 0.14), nameWidth, nameHeight, 0, 0, nameWidth, nameHeight);
            
            const internalImageData = cropCanvas.toDataURL('image/jpeg', 0.85);
            const studentId = "STU_" + Date.now();
            await saveImageInternal(studentId, internalImageData);

            const availableCodes = Object.keys(currentBatch.keys);
            const detectedCode = availableCodes[Math.floor(Math.random() * availableCodes.length)];
            const keyObj = currentBatch.keys[detectedCode];

            // Chấm Phần I (12 câu)
            let p1Correct = 0;
            let stuChoicesP1 = [];
            keyObj.part1.forEach(ans => {
                const choice = (Math.random() > 0.15) ? ans : ['A','B','C','D'][Math.floor(Math.random()*4)];
                stuChoicesP1.push(choice);
                if (choice === ans) p1Correct++;
            });
            const p1Score = p1Correct * 0.25;

            // Chấm Phần II (4 câu Đúng/Sai)
            let p2Score = 0;
            let stuChoicesP2 = [];
            keyObj.part2.forEach(pattern => {
                let stuPattern = "";
                let match = 0;
                for (let i = 0; i < 4; i++) {
                    const ch = (Math.random() > 0.2) ? pattern[i] : (pattern[i] === 'Đ' ? 'S' : 'Đ');
                    stuPattern += ch;
                    if (ch === pattern[i]) match++;
                }
                stuChoicesP2.push(stuPattern);
                p2Score += calcPart2Score(match);
            });

            const totalScore = parseFloat((p1Score + p2Score).toFixed(2));
            const randomSBD = "010" + String(currentBatch.students.length + 1).padStart(2, '0');
            const sampleNames = ["Nguyễn Văn An", "Trần Thị Mai", "Lê Quốc Bảo", "Hoàng Kim Ngân", "Võ Minh Trí"];
            const detectedName = sampleNames[Math.floor(Math.random() * sampleNames.length)];

            currentBatch.students.unshift({
                id: studentId,
                name: detectedName,
                sbd: randomSBD,
                code: detectedCode,
                p1Score: p1Score,
                p2Score: p2Score,
                total: totalScore,
                choicesP1: stuChoicesP1,
                choicesP2: stuChoicesP2
            });
            saveStorage();

            alert(`✓ Đã chấm xong!\nHọc sinh: ${detectedName}\nMã đề: ${detectedCode} | SBD: ${randomSBD}\nĐiểm: ${totalScore}/7.0 điểm`);
            navigateTo('view-graded-list');
        }

        // =========================================================
        // 4. XUẤT KẾT QUẢ EXCEL VÀ NẠP ĐÁP ÁN
        // =========================================================
        function openExportModal() { document.getElementById('export-modal').style.display = 'flex'; }
        function closeExportModal() { document.getElementById('export-modal').style.display = 'none'; }

        function exportToExcel(type) {
            closeExportModal();
            if (!currentBatch.students || currentBatch.students.length === 0) {
                alert("Chưa có dữ liệu bài chấm!");
                return;
            }
            let exportData = [];
            let fileName = "";

            if (type === 'DIEM') {
                fileName = `Ket_Qua_Diem_${currentBatch.name}.xlsx`;
                exportData = currentBatch.students.map((st, idx) => ({
                    "STT": idx + 1, "Họ và Tên": st.name, "Số Báo Danh": st.sbd,
                    "Mã Đề": st.code, "Điểm Phần I": st.p1Score, "Điểm Phần II": st.p2Score, "Tổng Điểm": st.total
                }));
            } else if (type === 'LUA_CHON') {
                fileName = `Ket_Qua_Lua_Chon_${currentBatch.name}.xlsx`;
                exportData = currentBatch.students.map((st, idx) => {
                    let row = { "STT": idx + 1, "Họ Tên": st.name, "SBD": st.sbd, "Mã Đề": st.code };
                    st.choicesP1.forEach((ans, qIdx) => { row[`Câu ${qIdx+1}`] = ans; });
                    return row;
                });
            } else if (type === 'DUNG_SAI') {
                fileName = `Ket_Qua_Dung_Sai_${currentBatch.name}.xlsx`;
                exportData = currentBatch.students.map((st, idx) => {
                    let row = { "STT": idx + 1, "Họ Tên": st.name, "SBD": st.sbd, "Mã Đề": st.code };
                    st.choicesP2.forEach((pat, qIdx) => { row[`Câu ${qIdx+13}`] = pat; });
                    return row;
                });
            }

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "KetQua");
            XLSX.writeFile(workbook, fileName);
        }

        function openKeySyncDialog() {
            document.getElementById('qr-dialog').style.display = 'flex';
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, (decodedText) => {
                try {
                    const data = JSON.parse(decodedText);
                    if (data.type === "OMR_2025" && data.keys) {
                        currentBatch.keys = data.keys;
                        saveStorage();
                        alert("Đã cập nhật đáp án mới!");
                        closeKeySyncDialog();
                    }
                } catch(e) {}
            }).catch(err => console.error(err));
        }

        function closeKeySyncDialog() {
            if (qrScanner) {
                qrScanner.stop().catch(()=>{});
                qrScanner = null;
            }
            document.getElementById('qr-dialog').style.display = 'none';
        }
    </script>
</body>
</html>
