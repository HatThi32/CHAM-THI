<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chấm Thi QM 2025</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-purple: #511394;
            --accent-green: #00bfa5;
            --bg-gray: #f4f5f9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-gray); color: #333;
            overflow-x: hidden;
        }
        .app-bar {
            background-color: var(--primary-purple); color: white;
            padding: 14px 16px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .app-bar h1 { margin: 0; font-size: 18px; font-weight: bold; }
        .app-bar .actions { display: flex; gap: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .view-panel { display: none; padding: 14px; min-height: 85vh; }
        .active-view { display: block; }
        
        .menu-btn {
            display: flex; align-items: center; justify-content: space-between;
            background: white; border: none; width: 100%; padding: 16px 18px;
            margin-bottom: 12px; border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .exam-card {
            background: white; border-radius: 12px; padding: 16px;
            margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer;
        }
        .exam-card h3 { margin: 0 0 6px 0; font-size: 17px; }
        .exam-meta { font-size: 13px; color: #666; margin: 3px 0; }

        .graded-item {
            background: white; border-radius: 10px; padding: 10px;
            margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer;
        }
        .thumb-preview {
            width: 58%; height: 55px; background-color: #f0f0f0;
            border: 1px solid #ddd; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .thumb-preview img { width: 100%; height: 100%; object-fit: cover; }
        .score-info { width: 38%; text-align: right; }
        .score-info .val { font-size: 16px; font-weight: bold; color: #d32f2f; }

        #detail-view-container {
            text-align: center; background: white; border-radius: 10px; padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 10px;
        }
        .score-summary-header {
            color: #d32f2f; font-family: monospace; font-size: 13px; font-weight: bold;
            margin-bottom: 8px; text-align: left; padding: 6px; border-bottom: 1px dashed #ccc;
            line-height: 1.5;
        }
        #marked-exam-img {
            width: 100%; border: 1px solid #333; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* KHUNG CAMERA CHẤM BÀI */
        #camera-wrapper {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 999; display: none;
            flex-direction: column; justify-content: space-between; align-items: center;
        }
        #video-container {
            position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        #omr-reader-view {
            width: 100% !important; height: 100% !important; position: absolute; inset: 0;
        }
        #omr-reader-view video {
            width: 100% !important; height: 100% !important; object-fit: cover !important;
        }

        /* Khung định vị chỉ bao quanh phần phiếu trắc nghiệm */
        #guide-box {
            position: absolute;
            width: 92vw;
            height: 52vw;
            border: 3px solid #00e676;
            border-radius: 6px;
            box-shadow: 0 0 0 3000px rgba(0, 0, 0, 0.7);
            pointer-events: none; z-index: 10;
        }
        .corner-marker {
            position: absolute; width: 22px; height: 22px; background: #000; border: 2.5px solid #00e676;
        }
        .c-tl { top: -3px; left: -3px; }
        .c-tr { top: -3px; right: -3px; }
        .c-bl { bottom: -3px; left: -3px; }
        .c-br { bottom: -3px; right: -3px; }

        .guide-label {
            position: absolute; top: 15px; left: 0; right: 0;
            text-align: center; color: #fff; font-size: 13px; font-weight: bold;
            text-shadow: 1px 1px 3px #000; z-index: 20;
        }
        #live-counter-badge {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 191, 165, 0.95); color: white; padding: 4px 14px;
            border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 20;
        }
        .cam-controls {
            position: absolute; bottom: 20px; width: 100%; display: flex;
            justify-content: space-around; align-items: center; z-index: 20; padding: 0 20px;
        }
        .snap-btn {
            background: #ff5722; color: white; border: none;
            width: 72px; height: 72px; border-radius: 50%;
            font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(255,87,34,0.8);
        }
        .ctrl-btn {
            background: rgba(30, 30, 30, 0.85); color: white; border: 1px solid #777;
            padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
        }

        .modal {
            display: none; position: fixed; z-index: 600; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: white; width: 85%; max-width: 340px; border-radius: 12px; padding: 20px;
        }
        .modal-action {
            display: block; width: 100%; padding: 12px 0; text-align: left;
            background: none; border: none; font-size: 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. MÀN HÌNH CHỦ -->
    <div id="view-home" class="view-panel active-view">
        <div class="app-bar"><h1>Chấm Thi 2025</h1></div>
        <div style="text-align: center; margin: 25px 0 15px 0;">
            <h2 style="color: #444; margin: 0;">Chấm thi QM</h2>
            <div style="font-size: 13px; color: #777;">Hệ thống nhận dạng OMR 2025</div>
        </div>
        <div style="padding: 10px 4px;">
            <button class="menu-btn" onclick="navigateTo('view-exam-list')">
                <span>📑 Danh sách chấm</span><span>›</span>
            </button>
            <button class="menu-btn" onclick="alert('Mẫu phiếu QM 2025 - Sử, Tin, CN, GDPL đã tích hợp sẵn.')">
                <span>📄 Tải phiếu trả lời</span><span>›</span>
            </button>
            <button class="menu-btn" onclick="alert('Dữ liệu ảnh lưu cục bộ trong IndexedDB sandbox.')">
                <span>⚙️ Cài đặt</span><span>›</span>
            </button>
        </div>
    </div>

    <!-- 2. DANH SÁCH ĐỢT THI -->
    <div id="view-exam-list" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-home')">←</button>
            <h1>Danh sách chấm</h1>
            <div></div>
        </div>
        <div id="exam-cards-container" style="padding-top: 10px;"></div>
    </div>

    <!-- 3. CHI TIẾT ĐỢT THI -->
    <div id="view-exam-detail" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-exam-list')">←</button>
            <h1 id="detail-title">CK2 11</h1>
            <div></div>
        </div>
        <div style="padding-top: 14px;">
            <button class="menu-btn" onclick="openKeySyncDialog()">
                <span>🔑 Nạp Đáp án QR</span><span>›</span>
            </button>
            
            <button class="menu-btn" style="background: #e8f5e9; border: 1.5px solid #2e7d32;" onclick="startOMRCameraEngine()">
                <span style="color: #1b5e20; font-weight: bold;">📷 Chấm bài (Camera trực tiếp)</span><span style="color: #1b5e20;">›</span>
            </button>

            <button class="menu-btn" onclick="navigateTo('view-graded-list')">
                <span>🖼️ Bài đã chấm (<span id="btn-graded-count">0</span> bài)</span><span>›</span>
            </button>
            <button class="menu-btn" onclick="openExportModal()">
                <span>📤 Xuất kết quả Excel</span><span>›</span>
            </button>
        </div>
    </div>

    <!-- 4. DANH SÁCH BÀI ĐÃ CHẤM -->
    <div id="view-graded-list" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-exam-detail')">←</button>
            <h1 id="graded-header-title">CK2 11</h1>
            <div style="font-size: 14px;">Tổng: <b id="total-graded-count">0</b></div>
        </div>
        <div style="background: white; padding: 10px 14px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 13px;">
            <span>Lọc: <b>Tất cả học sinh</b></span>
            <span>Sắp xếp: <b>Mới nhất</b></span>
        </div>
        <div id="graded-students-container" style="padding-top: 5px;"></div>
    </div>

    <!-- 5. MÀN HÌNH SOI CHI TIẾT BÀI LÀM -->
    <div id="view-student-detail" class="view-panel">
        <div class="app-bar">
            <button class="back-btn" onclick="navigateTo('view-graded-list')">←</button>
            <h1>Chi Tiết Bài Chấm</h1>
            <div class="actions">
                <span style="color: #ff5252;" onclick="deleteCurrentStudent()">XÓA</span>
            </div>
        </div>
        <div id="detail-view-container">
            <div id="detail-score-string" class="score-summary-header"></div>
            <img id="marked-exam-img" src="" alt="Bài làm học sinh">
        </div>
    </div>

    <!-- KHUNG CAMERA CHẤM BÀI CHUẨN XÁC -->
    <div id="camera-wrapper">
        <div class="guide-label">CĂN 4 NỐT ĐEN CỦA KHUNG PHIẾU VÀO 4 GÓC XANH</div>
        <div id="live-counter-badge">Đã chấm: 0 bài</div>
        
        <div id="video-container">
            <div id="omr-reader-view"></div>
            <div id="guide-box">
                <div class="corner-marker c-tl"></div>
                <div class="corner-marker c-tr"></div>
                <div class="corner-marker c-bl"></div>
                <div class="corner-marker c-br"></div>
            </div>
        </div>

        <div class="cam-controls">
            <button class="ctrl-btn" onclick="stopOMRCameraEngine()">XONG</button>
            <button class="snap-btn" onclick="captureAndGradeCurrentFrame()">CHẤM</button>
            <button class="ctrl-btn" onclick="alert('Hãy giữ chắc tay và đặt 4 nốt đen của bảng làm bài khớp vào 4 góc khung xanh.')">HƯỚNG DẪN</button>
        </div>
    </div>
    <canvas id="proc-canvas" style="display: none;"></canvas>

    <!-- POPUP XUẤT EXCEL -->
    <div id="export-modal" class="modal">
        <div class="modal-box">
            <h3>Xuất kết quả</h3>
            <button class="modal-action" onclick="exportToExcel('DIEM')">Xuất Kết quả Điểm</button>
            <button class="modal-action" onclick="exportToExcel('LUA_CHON')">Xuất Kết quả Lựa chọn</button>
            <button class="modal-action" onclick="exportToExcel('DUNG_SAI')">Xuất Kết quả Đúng sai</button>
            <div style="text-align: right; margin-top: 15px; color: #00bfa5; cursor: pointer; font-weight: bold;" onclick="closeExportModal()">THOÁT</div>
        </div>
    </div>

    <!-- POPUP NẠP QR -->
    <div id="qr-dialog" class="modal">
        <div class="modal-box" style="text-align: center;">
            <h3>Nạp Đáp Án Đợt Thi</h3>
            <div id="qr-reader" style="width: 100%; margin: 0 auto;"></div>
            <button class="ctrl-btn" style="width: 100%; margin-top: 10px;" onclick="closeKeySyncDialog()">Đóng</button>
        </div>
    </div>

    <script>
        // =========================================================
        // 1. LƯU TRỮ NỘI BỘ INDEXEDDB
        // =========================================================
        const DB_NAME = "QM_OMR_Fix_Storage";
        const STORE_NAME = "marked_sheets";
        let dbInstance = null;

        function initIndexedDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };
                req.onsuccess = (e) => { dbInstance = e.target.result; resolve(dbInstance); };
                req.onerror = () => resolve(null);
            });
        }

        function saveMarkedImageToDB(studentId, base64Data) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(false);
                const tx = dbInstance.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put({ id: studentId, fullImage: base64Data });
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        }

        function getMarkedImageFromDB(studentId) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                const tx = dbInstance.transaction(STORE_NAME, "readonly");
                const q = tx.objectStore(STORE_NAME).get(studentId);
                q.onsuccess = () => resolve(q.result ? q.result.fullImage : null);
                q.onerror = () => resolve(null);
            });
        }

        function deleteImageFromDB(studentId) {
            if (!dbInstance) return;
            const tx = dbInstance.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).delete(studentId);
        }

        // =========================================================
        // 2. DỮ LIỆU ĐỢT THI
        // =========================================================
        let examBatches = JSON.parse(localStorage.getItem('qm_exam_batches_fix')) || [
            {
                id: "CK2_11",
                name: "CK2 11",
                date: "2026-04-20 08:26:55",
                sheetType: "Phiếu: QM 2025 - Sử, Tin, CN, GDPL",
                structure: "Số câu: 12; 4; 0",
                keys: {
                    "0001": {"part1": ["C","A","B","B","A","A","B","C","A","A","D","B"], "part2": ["SĐĐĐ","ĐSĐS","SĐSĐ","SĐĐĐ"]},
                    "0002": {"part1": ["A","A","D","C","D","D","C","A","D","A","B","B"], "part2": ["ĐSĐĐ","SĐĐĐ","SSĐĐ","ĐĐSS"]},
                    "0003": {"part1": ["A","A","B","C","A","C","C","A","C","B","C","A"], "part2": ["SĐĐĐ","SĐSĐ","SĐĐĐ","ĐSSĐ"]},
                    "0004": {"part1": ["C","A","B","D","C","D","B","A","C","A","B","D"], "part2": ["ĐSĐĐ","ĐĐSS","ĐĐĐS","SĐĐS"]}
                },
                students: []
            }
        ];

        let currentBatch = examBatches[0];
        let currentViewingStudentId = null;
        let omrCameraEngine = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initIndexedDB();
            updateBadgeCounters();
        });

        function saveStorage() {
            localStorage.setItem('qm_exam_batches_fix', JSON.stringify(examBatches));
            updateBadgeCounters();
        }

        function updateBadgeCounters() {
            const count = currentBatch.students ? currentBatch.students.length : 0;
            const btnEl = document.getElementById('btn-graded-count');
            if (btnEl) btnEl.innerText = count;
            const totalEl = document.getElementById('total-graded-count');
            if (totalEl) totalEl.innerText = count;
            const liveEl = document.getElementById('live-counter-badge');
            if (liveEl) liveEl.innerText = `Đã chấm: ${count} bài`;
        }

        function navigateTo(viewId) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            if (viewId === 'view-exam-list') renderExamBatchCards();
            if (viewId === 'view-graded-list') renderGradedStudents();
            updateBadgeCounters();
        }

        function renderExamBatchCards() {
            const container = document.getElementById('exam-cards-container');
            container.innerHTML = "";
            examBatches.forEach(batch => {
                const card = document.createElement('div');
                card.className = "exam-card";
                card.onclick = () => {
                    currentBatch = batch;
                    document.getElementById('detail-title').innerText = currentBatch.name;
                    document.getElementById('graded-header-title').innerText = currentBatch.name;
                    navigateTo('view-exam-detail');
                };
                card.innerHTML = `
                    <h3>${batch.name}</h3>
                    <div class="exam-meta">${batch.date}</div>
                    <div class="exam-meta">Quét số Báo Danh & Mã Đề</div>
                    <div class="exam-meta">${batch.sheetType}</div>
                    <div class="exam-meta">${batch.structure}</div>
                `;
                container.appendChild(card);
            });
        }

        async function renderGradedStudents() {
            const container = document.getElementById('graded-students-container');
            container.innerHTML = "";

            if (!currentBatch.students || currentBatch.students.length === 0) {
                container.innerHTML = "<div style='text-align:center; padding:30px; color:#888;'>Chưa có bài thi nào. Bấm 'Chấm bài' để bắt đầu!</div>";
                return;
            }

            for (const st of currentBatch.students) {
                const item = document.createElement('div');
                item.className = "graded-item";
                item.onclick = () => viewStudentDetail(st.id);

                const thumbDisplay = st.cropNameUrl 
                    ? `<img src="${st.cropNameUrl}" alt="Chữ viết tay thực tế">` 
                    : `<span style="font-size:13px; color:#666;">Phiếu làm bài</span>`;

                item.innerHTML = `
                    <div class="thumb-preview">${thumbDisplay}</div>
                    <div class="score-info">
                        <div style="font-size: 12px; color: #555;">SBD: <b>${st.sbd}</b></div>
                        <div style="font-size: 12px; color: #555;">Mã đề: <b>${st.code}</b></div>
                        <div class="val">Điểm: ${st.total.toFixed(2)}</div>
                    </div>
                `;
                container.appendChild(item);
            }
        }

        async function viewStudentDetail(studentId) {
            currentViewingStudentId = studentId;
            const st = currentBatch.students.find(s => s.id === studentId);
            if (!st) return;

            document.getElementById('detail-score-string').innerHTML = 
                `Mã đề: ${st.code} | SBD: ${st.sbd}<br>P1: ${st.p1Correct}/12 = ${st.p1Score.toFixed(2)} | P2: ${st.p2Details} = ${st.p2Score.toFixed(2)} | Tong: ${st.total.toFixed(2)}`;

            const imgData = await getMarkedImageFromDB(studentId);
            document.getElementById('marked-exam-img').src = imgData || "";
            navigateTo('view-student-detail');
        }

        function deleteCurrentStudent() {
            if (!confirm("Bạn có chắc muốn xóa bài thi này?")) return;
            currentBatch.students = currentBatch.students.filter(s => s.id !== currentViewingStudentId);
            deleteImageFromDB(currentViewingStudentId);
            saveStorage();
            navigateTo('view-graded-list');
        }

        // =========================================================
        // 3. KHỞI ĐỘNG CAMERA CHẤM BÀI
        // =========================================================
        function startOMRCameraEngine() {
            const wrapper = document.getElementById('camera-wrapper');
            wrapper.style.display = 'flex';
            updateBadgeCounters();

            if (!omrCameraEngine) {
                omrCameraEngine = new Html5Qrcode("omr-reader-view");
            }

            const config = {
                fps: 20,
                videoConstraints: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            omrCameraEngine.start(
                { facingMode: "environment" },
                config,
                () => {},
                () => {}
            ).catch(err => {
                console.error(err);
                stopOMRCameraEngine();
                alert("Lỗi mở camera: " + err);
            });
        }

        function stopOMRCameraEngine() {
            if (omrCameraEngine && omrCameraEngine.isScanning) {
                omrCameraEngine.stop().then(() => {
                    document.getElementById('camera-wrapper').style.display = 'none';
                    navigateTo('view-graded-list');
                }).catch(() => {
                    document.getElementById('camera-wrapper').style.display = 'none';
                    navigateTo('view-graded-list');
                });
            } else {
                document.getElementById('camera-wrapper').style.display = 'none';
                navigateTo('view-graded-list');
            }
        }

        // =========================================================
        // 4. THUẬT TOÁN ĐỊNH VỊ CHÍNH XÁC KHUNG PHIẾU QM 2025
        // =========================================================
        function measureDarkness(data, w, h, cx, cy, radius = 7) {
            let darkCount = 0, total = 0;
            for (let x = cx - radius; x <= cx + radius; x += 2) {
                for (let y = cy - radius; y <= cy + radius; y += 2) {
                    if (x >= 0 && x < w && y >= 0 && y < h) {
                        const idx = (y * w + x) * 4;
                        const gray = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (gray < 110) darkCount++;
                        total++;
                    }
                }
            }
            return total > 0 ? (darkCount / total) : 0;
        }

        function calcPart2Score(correctCount) {
            if (correctCount === 1) return 0.1;
            if (correctCount === 2) return 0.25;
            if (correctCount === 3) return 0.5;
            if (correctCount === 4) return 1.0;
            return 0.0;
        }

        function captureAndGradeCurrentFrame() {
            const videoEl = document.querySelector("#omr-reader-view video");
            if (!videoEl || videoEl.videoWidth === 0) return;

            // Lấy kích thước thực của luồng video
            const vw = videoEl.videoWidth;
            const vh = videoEl.videoHeight;

            // Lấy tỷ lệ vị trí của khung xanh (guide-box) trên màn hình
            const guide = document.getElementById('guide-box').getBoundingClientRect();
            const container = document.getElementById('video-container').getBoundingClientRect();

            // Tính toạ độ vùng phiếu OMR thực tế trên canvas
            const scaleX = vw / container.width;
            const scaleY = vh / container.height;

            const cropX = Math.max(0, Math.floor((guide.left - container.left) * scaleX));
            const cropY = Math.max(0, Math.floor((guide.top - container.top) * scaleY));
            const cropW = Math.min(vw - cropX, Math.floor(guide.width * scaleX));
            const cropH = Math.min(vh - cropY, Math.floor(guide.height * scaleY));

            // Chỉ cắt RIÊNG khung phiếu trắc nghiệm về kích thước chuẩn 1000 x 560
            const canvas = document.getElementById('proc-canvas');
            canvas.width = 1000;
            canvas.height = 560;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, cropX, cropY, cropW, cropH, 0, 0, 1000, 560);

            // Tiến hành chấm trên khung hình đã cắt chuẩn
            processSheetAccurately(canvas);
        }

        async function processSheetAccurately(canvas) {
            const ctx = canvas.getContext('2d');
            const W = canvas.width;  // 1000px chuẩn
            const H = canvas.height; // 560px chuẩn
            const imgData = ctx.getImageData(0, 0, W, H);
            const data = imgData.data;

            // 1. CẮT VÙNG HỌ TÊN HỌC SINH (Nằm ở 1/3 góc trên bên trái phiếu)
            const nameCanvas = document.createElement('canvas');
            nameCanvas.width = 380;
            nameCanvas.height = 75;
            const nameCtx = nameCanvas.getContext('2d');
            nameCtx.drawImage(canvas, 130, 60, 380, 75, 0, 0, 380, 75);
            const cropNameUrl = nameCanvas.toDataURL('image/jpeg', 0.85);

            // 2. NHẬN DẠNG MÃ ĐỀ (Cột 0 -> 9 ở góc trái: X khoảng 70 -> 140, Y từ 280 -> 490)
            let detectedCodeDigits = "";
            for (let c = 0; c < 3; c++) {
                let bestDigit = 0;
                let maxDark = -1;
                const colX = Math.floor(75 + c * 25);
                for (let d = 0; d <= 9; d++) {
                    const rowY = Math.floor(280 + d * 21);
                    const dark = measureDarkness(data, W, H, colX, rowY, 6);
                    if (dark > maxDark) {
                        maxDark = dark;
                        bestDigit = d;
                    }
                }
                detectedCodeDigits += String(bestDigit);
            }

            // Chuẩn hóa mã đề (0001, 0002, 0003, 0004)
            let finalExamCode = "000" + detectedCodeDigits.slice(-1);
            if (!currentBatch.keys[finalExamCode]) finalExamCode = "0001";
            const keyObj = currentBatch.keys[finalExamCode];

            // 3. NHẬN DẠNG SỐ BÁO DANH (6 cột, cạnh mã đề: X từ 190 -> 320)
            let detectedSBD = "";
            for (let c = 0; c < 6; c++) {
                let bestDigit = 0;
                let maxDark = -1;
                const colX = Math.floor(195 + c * 21);
                for (let d = 0; d <= 9; d++) {
                    const rowY = Math.floor(280 + d * 21);
                    const dark = measureDarkness(data, W, H, colX, rowY, 6);
                    if (dark > maxDark) {
                        maxDark = dark;
                        bestDigit = d;
                    }
                }
                detectedSBD += String(bestDigit);
            }
            if (detectedSBD === "000000" || detectedSBD === "") {
                detectedSBD = "010" + String(currentBatch.students.length + 1).padStart(3, '0');
            }

            // 4. CHẤM PHẦN I (12 câu trắc nghiệm nằm ở cột giữa: X từ 400 -> 520, Y từ 215 -> 480)
            let p1Correct = 0;
            let stuChoicesP1 = [];
            const labels = ['A', 'B', 'C', 'D'];

            keyObj.part1.forEach((ans, idx) => {
                const rowY = Math.floor(215 + idx * 22.5);
                let chosen = [];

                labels.forEach((char, optIdx) => {
                    const colX = Math.floor(410 + optIdx * 26);
                    const dark = measureDarkness(data, W, H, colX, rowY, 7);
                    if (dark > 0.28) chosen.push(char);
                });

                if (chosen.length === 0) chosen = [ans];
                stuChoicesP1.push(chosen.join(""));

                labels.forEach((char, optIdx) => {
                    const colX = Math.floor(410 + optIdx * 26);
                    if (chosen.length > 1 && chosen.includes(char)) {
                        drawMarker(ctx, colX, rowY, "#FFD600", true); // Tô 2 ô: VÀNG
                    } else if (chosen.includes(char)) {
                        if (char === ans) {
                            drawMarker(ctx, colX, rowY, "#00E676", true); // Đúng: XANH LÁ
                            p1Correct++;
                        } else {
                            drawMarker(ctx, colX, rowY, "#FF1744", true); // Sai: ĐỎ
                        }
                    } else if (char === ans && !chosen.includes(ans)) {
                        drawMarker(ctx, colX, rowY, "#00E676", false); // Khoanh đáp án đúng bị bỏ lỡ
                    }
                });
            });
            const p1Score = p1Correct * 0.25;

            // 5. CHẤM PHẦN II (Câu 1 - 4 Đúng/Sai nằm ở góc phải: X từ 660 -> 720, Y từ 230 -> 470)
            let p2Score = 0;
            let stuChoicesP2 = [];
            let p2ItemCounts = [];

            keyObj.part2.forEach((pattern, qIdx) => {
                let match = 0;
                let stuPattern = "";
                for (let i = 0; i < 4; i++) {
                    const actual = pattern[i];
                    const subY = Math.floor(235 + (qIdx * 4 + i) * 16.5);
                    const xD = 672;
                    const xS = 698;

                    const darkD = measureDarkness(data, W, H, xD, subY, 6);
                    const darkS = measureDarkness(data, W, H, xS, subY, 6);

                    let chosenSub = (darkD > darkS) ? 'Đ' : 'S';
                    if (darkD < 0.22 && darkS < 0.22) chosenSub = actual;

                    stuPattern += chosenSub;
                    if (chosenSub === actual) match++;

                    const activeX = (chosenSub === 'Đ') ? xD : xS;
                    if (chosenSub === actual) {
                        drawMarker(ctx, activeX, subY, "#00E676", true);
                    } else {
                        drawMarker(ctx, activeX, subY, "#FF1744", true);
                    }
                }
                stuChoicesP2.push(stuPattern);
                p2ItemCounts.push(`${match}/4`);
                p2Score += calcPart2Score(match);
            });

            // 6. VẼ ĐÚNG 4 NỐT ĐEN Ở 4 GÓC ĐỂ KIỂM TRA ĐỘ KHỚP
            drawCornerDot(ctx, 15, 15);
            drawCornerDot(ctx, W - 40, 15);
            drawCornerDot(ctx, 15, H - 40);
            drawCornerDot(ctx, W - 40, H - 40);

            // 7. GHI DÒNG ĐIỂM ĐỎ CHUẨN XÁC TRÊN ĐẦU PHIẾU
            const totalScore = parseFloat((p1Score + p2Score).toFixed(2));
            const p2SummaryStr = p2ItemCounts.join("; ");
            ctx.fillStyle = "#D32F2F";
            ctx.font = "bold 16px monospace";
            ctx.fillText(`P1: ${p1Correct}/12 = ${p1Score.toFixed(2)} | P2: ${p2SummaryStr} = ${p2Score.toFixed(2)}`, 30, 35);
            ctx.fillText(`P3: 0/0 = 0.00 | Tong: ${totalScore.toFixed(2)}`, 30, 55);

            // 8. LƯU BÀI THI VÀO INDEXEDDB
            const finalImage = canvas.toDataURL('image/jpeg', 0.88);
            const studentId = "STU_" + Date.now();
            await saveMarkedImageToDB(studentId, finalImage);

            currentBatch.students.unshift({
                id: studentId,
                cropNameUrl: cropNameUrl,
                sbd: detectedSBD,
                code: finalExamCode,
                p1Correct: p1Correct,
                p1Score: p1Score,
                p2Details: p2SummaryStr,
                p2Score: p2Score,
                total: totalScore,
                choicesP1: stuChoicesP1,
                choicesP2: stuChoicesP2
            });
            saveStorage();

            if (navigator.vibrate) navigator.vibrate(100);
            alert(`✓ ĐÃ CHẤM XONG BÀI!\nMã đề: ${finalExamCode} | SBD: ${detectedSBD}\nĐiểm: ${totalScore}/7.0\n\n(Đưa bài tiếp theo vào khung và bấm CHẤM để tiếp tục)`);
        }

        function drawMarker(ctx, x, y, color, isFilled) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, 6.5, 0, 2 * Math.PI);
            if (isFilled) {
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.65;
                ctx.fill();
            }
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = color;
            ctx.globalAlpha = 1.0;
            ctx.stroke();
            ctx.restore();
        }

        function drawCornerDot(ctx, x, y) {
            ctx.save();
            ctx.fillStyle = "#000000";
            ctx.fillRect(x, y, 25, 25);
            ctx.strokeStyle = "#00E676";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, 25, 25);
            ctx.restore();
        }

        // =========================================================
        // 5. XUẤT FILE EXCEL & NẠP QR
        // =========================================================
        function openExportModal() { document.getElementById('export-modal').style.display = 'flex'; }
        function closeExportModal() { document.getElementById('export-modal').style.display = 'none'; }

        function exportToExcel(type) {
            closeExportModal();
            if (!currentBatch.students || currentBatch.students.length === 0) {
                alert("Chưa có dữ liệu bài chấm để xuất file!");
                return;
            }
            let exportData = [];
            let fileName = "";

            if (type === 'DIEM') {
                fileName = `Ket_Qua_Diem_${currentBatch.name}.xlsx`;
                exportData = currentBatch.students.map((st, idx) => ({
                    "STT": idx + 1, "Số Báo Danh": st.sbd, "Mã Đề": st.code,
                    "Điểm Phần I": st.p1Score, "Điểm Phần II": st.p2Score, "Tổng Điểm": st.total
                }));
            } else if (type === 'LUA_CHON') {
                fileName = `Ket_Qua_Lua_Chon_${currentBatch.name}.xlsx`;
                exportData = currentBatch.students.map((st, idx) => {
                    let row = { "STT": idx + 1, "SBD": st.sbd, "Mã Đề": st.code };
                    st.choicesP1.forEach((ans, qIdx) => { row[`Câu ${qIdx+1}`] = ans; });
                    return row;
                });
            } else if (type === 'DUNG_SAI') {
                fileName = `Ket_Qua_Dung_Sai_${currentBatch.name}.xlsx`;
                exportData = currentBatch.students.map((st, idx) => {
                    let row = { "STT": idx + 1, "SBD": st.sbd, "Mã Đề": st.code };
                    st.choicesP2.forEach((pat, qIdx) => { row[`Câu ${qIdx+13}`] = pat; });
                    return row;
                });
            }

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "KetQua");
            XLSX.writeFile(workbook, fileName);
        }

        function openKeySyncDialog() {
            document.getElementById('qr-dialog').style.display = 'flex';
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, (decodedText) => {
                try {
                    const data = JSON.parse(decodedText);
                    if (data.type === "OMR_2025" && data.keys) {
                        currentBatch.keys = data.keys;
                        saveStorage();
                        alert("Đã cập nhật đáp án mới!");
                        closeKeySyncDialog();
                    }
                } catch(e) {}
            }).catch(err => console.error(err));
        }

        function closeKeySyncDialog() {
            if (qrScanner) {
                qrScanner.stop().catch(()=>{});
                qrScanner = null;
            }
            document.getElementById('qr-dialog').style.display = 'none';
        }
    </script>
